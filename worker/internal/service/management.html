<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>访谈管理</title>
<style>body{font:15px/1.6 system-ui,sans-serif;background:#f6f7f9;color:#26303e;margin:0}main{max-width:960px;margin:auto;padding:32px 20px}header{display:flex;align-items:center;justify-content:space-between}section{background:white;border:1px solid #dde2e8;border-radius:12px;padding:24px;margin:20px 0}h1{font-size:25px}h2{font-size:19px}button,input{font:inherit;border:1px solid #ccd3dc;border-radius:7px;padding:9px 12px}button{cursor:pointer;background:white}button.primary{background:#a63c38;color:white;border:0}label{display:block;margin:12px 0}input{max-width:100%;box-sizing:border-box}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #eee}small{color:#657080}#error{color:#ad2323;white-space:pre-wrap}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f8fa;padding:16px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}[hidden]{display:none!important}</style></head>
<body><main><header><h1>访谈管理</h1><button id="logout" hidden>退出登录</button></header><p id="error" role="alert"></p><section id="login"><h2>登录</h2><form id="login-form"><label>用户名 <input name="username" value="admin" autocomplete="username" required></label><label>密码 <input name="password" type="password" autocomplete="current-password" required></label><button class="primary">登录</button></form></section><div id="workspace" hidden><section><h2>题包</h2><p><small>上传 DSH 导出的 JSON。相同文件键的不同内容不会覆盖，请使用新版本文件键。</small></p><form id="upload-form" class="row"><input id="pack-file" type="file" accept=".json,application/json" required><input id="pack-key" placeholder="文件键，例如 FN-example-v1" pattern="[a-zA-Z0-9_-]{1,100}" required aria-label="题包文件键"><button class="primary">上传题包</button></form><p id="issues"></p><div style="overflow:auto"><table><thead><tr><th>访谈</th><th>版本</th><th>题数</th><th>操作</th></tr></thead><tbody id="packs"></tbody></table></div></section><section><div class="row"><h2>报告</h2><button id="refresh">刷新</button></div><small>显示最近 200 个报告任务，包含等待、失败和完成状态。</small><div id="reports"></div><div id="report-detail" hidden><iframe id="report-frame" title="报告网页预览" sandbox="allow-same-origin allow-downloads" referrerpolicy="no-referrer" style="width:100%;height:900px;border:1px solid #dde2e8;border-radius:8px;margin-top:20px"></iframe></div></section></div></main>
<script type="module">
const el=id=>document.getElementById(id)
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
const api=async(path,options={})=>{const r=await fetch('/admin/api/'+path,{credentials:'same-origin',...options});const v=await r.json();if(!r.ok)throw new Error(v.error_code||`HTTP ${r.status}`);return v}
const action=fn=>async event=>{event?.preventDefault();el('error').textContent='';try{await fn(event)}catch(e){el('error').textContent=e.message}}
const setSession=active=>{el('login').hidden=active;el('workspace').hidden=!active;el('logout').hidden=!active}
const reportURL=(id,format)=>'/admin/api/reports/'+encodeURIComponent(id)+'/'+format
const statusLabel=r=>({queued:'等待生成',running:'生成中',succeeded:'已完成',failed:'生成失败',superseded:'已被新版本替代'}[r.status]||r.status)+(r.error_code?' · '+r.error_code:'')
const load=async()=>{
  const [data,reports]=await Promise.all([api('packs'),api('reports')])
  el('packs').innerHTML=data.packs.map(p=>`<tr><td>${esc(p.fieldnoteId)}<br><small>${esc(p.key)}</small></td><td>${p.version}</td><td>${p.questions}</td><td><a href="/?fieldnoteId=${encodeURIComponent(p.key)}" target="_blank" rel="noopener">打开访谈</a> <button data-delete="${esc(p.key)}">移除题包</button></td></tr>`).join('')
  el('issues').textContent=data.invalid_files.length?`未加载的文件：${data.invalid_files.join('、')}`:''
  el('reports').innerHTML=reports.map(r=>`<p>${esc(r.interview_id)} · v${r.report_version} · ${esc(statusLabel(r))} <button data-report="${esc(r.id)}" ${r.status==='succeeded'?'':'disabled'}>网页预览</button>${r.status==='succeeded'?` <a href="${reportURL(r.id,'pdf')}" download>下载 PDF</a> · <a href="${reportURL(r.id,'view')}" target="_blank" rel="noopener">单独打开</a>`:''}</p>`).join('')||'<p>暂无报告</p>'
  document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=action(async()=>{if(confirm('移除当前目录文件？已绑定的访谈版本仍保留。')){await api('packs/'+encodeURIComponent(b.dataset.delete),{method:'DELETE'});await load()}}))
  document.querySelectorAll('[data-report]').forEach(b=>b.onclick=action(async()=>{el('report-frame').src=reportURL(b.dataset.report,'view');el('report-detail').hidden=false}))
}
el('login-form').onsubmit=action(async()=>{const f=new FormData(el('login-form'));await api('login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:f.get('username'),password:f.get('password')})});el('login-form').elements.password.value='';setSession(true);await load()})
el('logout').onclick=action(async()=>{await api('logout',{method:'POST'});setSession(false);el('packs').replaceChildren();el('reports').replaceChildren();el('report-detail').hidden=true;el('report-frame').removeAttribute('src')})
el('pack-file').onchange=()=>{const name=el('pack-file').files[0]?.name||'';el('pack-key').value=name.replace(/\.json$/i,'').replace(/[^a-zA-Z0-9_-]/g,'-').slice(0,100)}
el('upload-form').onsubmit=action(async()=>{const file=el('pack-file').files[0];await api('packs/'+encodeURIComponent(el('pack-key').value),{method:'POST',headers:{'Content-Type':'application/json'},body:await file.text()});el('pack-file').value='';await load()})
el('refresh').onclick=action(load)
try{await api('session');setSession(true);await load()}catch(e){if(e.message!=='ADMIN_SESSION_REQUIRED')el('error').textContent=e.message}
</script></body></html>
